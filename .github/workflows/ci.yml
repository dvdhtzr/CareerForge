name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CareerForge.slnx
      - name: Build
        run: dotnet build CareerForge.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test CareerForge.slnx --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: web
        run: npm run build
